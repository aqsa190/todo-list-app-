<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: white;
    }.container {
  background: rgba(255,255,255,0.08);
  padding: 25px;
  border-radius: 15px;
  width: 320px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

h2 {
  text-align: center;
  margin-bottom: 15px;
}

input {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 10px;
  margin-bottom: 10px;
  outline: none;
}

button {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 10px;
  background: #38bdf8;
  font-weight: bold;
  cursor: pointer;
}

ul {
  list-style: none;
  padding: 0;
  margin-top: 15px;
}

li {
  background: rgba(255,255,255,0.15);
  margin-bottom: 8px;
  padding: 10px;
  border-radius: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.delete {
  background: red;
  border: none;
  color: white;
  padding: 5px 8px;
  border-radius: 6px;
  cursor: pointer;
}

  </style>
</head>
<body>  <div class="container">
    <h2>My To-Do List</h2>
    <input type="text" id="taskInput" placeholder="Enter a task..." />
    <button onclick="addTask()">Add Task</button><ul id="taskList"></ul>

  </div>  <script>
    function addTask() {
      let input = document.getElementById('taskInput');
      let value = input.value.trim();

      if (value === '') return;

      let li = document.createElement('li');
      li.textContent = value;

      let btn = document.createElement('button');
      btn.textContent = 'X';
      btn.className = 'delete';
      btn.onclick = function() {
        li.remove();
      };

      li.appendChild(btn);
      document.getElementById('taskList').appendChild(li);

      input.value = '';
    }
  </script></body>
  </html>
